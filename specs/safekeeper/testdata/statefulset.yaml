apiVersion: apps/v1
kind: StatefulSet
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/component: safekeeper
    app.kubernetes.io/name: safekeeper
    app.kubernetes.io/part-of: neon
    molnett.org/cluster: test-cluster
    molnett.org/safekeeper: test-safekeeper
  name: test-cluster-safekeeper-1
  namespace: neon
spec:
  replicas: 1
  selector:
    matchLabels:
      molnett.org/safekeeper: test-safekeeper
  serviceName: test-cluster-safekeeper-1-headless
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/component: safekeeper
        app.kubernetes.io/name: safekeeper
        app.kubernetes.io/part-of: neon
        molnett.org/cluster: test-cluster
        molnett.org/safekeeper: test-safekeeper
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: safekeeper
                molnett.org/cluster: test-cluster
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --id=1
        - --broker-endpoint=http://test-cluster-storage-broker:50051
        - --listen-pg=0.0.0.0:5454
        - --listen-http=0.0.0.0:7676
        - --advertise-pg=test-cluster-safekeeper-1-0.test-cluster-safekeeper-1-headless.neon.svc.cluster.local:5454
        - --datadir=/data
        command:
        - /usr/local/bin/safekeeper
        image: neondatabase/neon:8463
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /v1/status
            port: 7676
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        name: safekeeper
        ports:
        - containerPort: 5454
          name: pg
        - containerPort: 7676
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /v1/status
            port: 7676
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /v1/status
            port: 7676
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /data
          name: safekeeper-storage
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      terminationGracePeriodSeconds: 30
  updateStrategy: {}
  volumeClaimTemplates:
  - metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/component: safekeeper
        app.kubernetes.io/name: safekeeper
        app.kubernetes.io/part-of: neon
        molnett.org/cluster: test-cluster
        molnett.org/safekeeper: test-safekeeper
      name: safekeeper-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    status: {}
status:
  availableReplicas: 0
  replicas: 0
