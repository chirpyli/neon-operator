---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: branches.neon.oltp.molnett.org
spec:
  group: neon.oltp.molnett.org
  names:
    kind: Branch
    listKind: BranchList
    plural: branches
    singular: branch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .status.conditions[?(@.type=="Progressing")].status
      name: Progressing
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Branch is the Schema for the branches API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Branch
            properties:
              default:
                description: |-
                  Default 是否为项目的默认分支。
                  每个项目只有一个默认分支。默认分支不能删除。
                type: boolean
              initSource:
                default: parent-data
                description: |-
                  InitSource 初始化源类型。
                  "parent-data": 从父分支复制全量数据（默认）。
                  "schema-only": 仅复制 schema，不复制数据。
                enum:
                - parent-data
                - schema-only
                type: string
              name:
                description: |-
                  Name 分支的显示名称（如 "main", "feat/xxx"）。
                  创建时必需，全局唯一在同一 Project 内。
                type: string
              parentBranch:
                description: |-
                  ParentBranch 父分支的 Name（显示名称，非 ID）。
                  为空表示创建主分支（初始分支），非空表示从已有分支创建子分支。
                type: string
              parentLSN:
                description: |-
                  ParentLSN 分支起始 LSN 位点。
                  仅在 ParentBranch 非空时有效，用于指定从父分支的哪个 LSN 创建分支。
                  格式如 "0/12345678"。
                type: string
              parentTimestamp:
                description: |-
                  ParentTimestamp 时间点分支 (PITR)。
                  仅在 ParentBranch 非空时有效，用于指定从父分支的哪个时间点创建分支。
                  与 ParentLSN 互斥，优先使用 ParentLSN。
                type: string
              pgVersion:
                description: |-
                  PGVersion specifies the PostgreSQL version to use for the branch.
                  kubebuilder:validation:Enum=14;15;16;17
                  kubebuilder:default:=17
                type: integer
              projectID:
                description: The ID of the Project this Branch belongs to
                type: string
              protected:
                description: |-
                  Protected 是否为受保护分支。
                  受保护分支不能直接删除。
                type: boolean
              timelineID:
                description: |-
                  Will be generated unless specified.
                  Has to be a 32 character alphanumeric string.
                type: string
            required:
            - pgVersion
            - projectID
            type: object
          status:
            description: status defines the observed state of Branch
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
