apiVersion: v1
data:
  pageserver.toml: |2

    # ===== 网络 =====
    listen_pg_addr = "0.0.0.0:6400"
    listen_http_addr = "0.0.0.0:9898"

    # ===== 文件描述符 =====
    max_file_descriptors = 1000

    # ===== 页面缓存 =====
    page_cache_size = 32768

    # ===== Broker =====
    broker_endpoint = "http://test-cluster-storage-broker:50051"
    broker_keepalive_interval = "5s"

    # ===== 控制平面 =====
    control_plane_api = "http://test-cluster-storage-controller:8080/upcall/v1/"

    # ===== PostgreSQL 分发目录 =====
    pg_distrib_dir = "/usr/local/"

    # ===== 远程存储 (S3) =====
    [remote_storage]
    bucket_name = "test-bucket"
    bucket_region = "us-east-1"
    prefix_in_bucket = "pageserver"
    endpoint = ""

    # ===== 磁盘驱逐 =====
    [disk_usage_based_eviction]
    max_usage_pct = 80
    min_avail_bytes = 2000000000
    period = "60s"

    # ===== 租户默认配置 =====
    [tenant_config]
    checkpoint_distance = 268435456
    compaction_threshold = 10
    compaction_target_size = 134217728
    gc_horizon = 67108864
    gc_period = "1h"
    pitr_interval = "7d"

    # ===== 日志 =====
    log_format = "json"

    # ===== 并发控制 =====
    concurrent_tenant_warmup = 8
    background_task_maximum_delay = "10s"

    # ===== 指标 =====
    metric_collection_interval = "60s"
kind: ConfigMap
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/component: pageserver
    app.kubernetes.io/name: pageserver
    app.kubernetes.io/part-of: neon
    molnett.org/cluster: test-cluster
    molnett.org/component: pageserver
    molnett.org/pageserver: test-pageserver
  name: test-cluster-pageserver-0
  namespace: neon
