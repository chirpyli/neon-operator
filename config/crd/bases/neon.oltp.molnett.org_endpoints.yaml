metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: endpoints.neon.oltp.molnett.org
spec:
  group: neon.oltp.molnett.org
  names:
    kind: Endpoint
    listKind: EndpointList
    plural: endpoints
    singular: endpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.branchID
      name: Branch
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.host
      name: Host
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Endpoint is the Schema for the endpoints API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Endpoint
            properties:
              branchID:
                description: BranchID 引用所属的 Branch。
                type: string
              disabled:
                description: |-
                  Disabled 是否禁用连接。
                  禁用后 Deployment replicas 设为 0，Service 保留。
                type: boolean
              exposure:
                description: |-
                  Exposure 覆盖 Cluster 级别的 PostgresExposure 策略。
                  不设置时使用 Cluster.Spec.PostgresExposure。
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations 透传到 Service 的 annotations。
                      用于云厂商 LB 配置，如 AWS NLB、GCP LB 等。
                    type: object
                  externalTrafficPolicy:
                    description: |-
                      ExternalTrafficPolicy 控制外部流量的路由策略。
                      Cluster：流量均匀分发到所有 Pod（默认，可能丢失源 IP）
                      Local：  保留客户端真实 IP，但要求 Pod 在接收流量的节点上运行
                    enum:
                    - Cluster
                    - Local
                    type: string
                  loadBalancerSourceRanges:
                    description: |-
                      LoadBalancerSourceRanges 限制可访问的源 IP CIDR 列表。
                      仅在 Type=LoadBalancer 时生效。用于安全白名单。
                    items:
                      type: string
                    type: array
                  type:
                    default: ClusterIP
                    description: |-
                      Type 决定 Service 类型。
                      ClusterIP：仅集群内访问（默认）
                      NodePort：  通过节点 IP + 端口对外暴露
                      LoadBalancer：云环境自动创建外部 LB
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              resources:
                description: |-
                  Resources 计算资源请求 (固定资源, 无弹性扩缩)。
                  未设置时继承 Project.Spec.DefaultEndpointSettings.Resources。
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              type:
                description: |-
                  Type 端点类型: read_write 或 read_only。
                  每个 Branch 最多一个 read_write 端点。
                enum:
                - read_write
                - read_only
                type: string
            required:
            - branchID
            - type
            type: object
          status:
            description: status defines the observed state of Endpoint
            properties:
              conditions:
                description: Conditions 详细状态条件。
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              host:
                description: Host 对外连接地址 (LoadBalancer hostname 或 Node IP)。
                type: string
              observedGeneration:
                description: ObservedGeneration 记录最近观察到的 generation。
                format: int64
                type: integer
              phase:
                description: |-
                  Phase 当前生命周期阶段。
                  "creating_compute" → "starting" → "active" → "stopping" → "stopped"
                  [未来 Serverless] active → idle → suspended
                type: string
              port:
                description: Port PostgreSQL 连接端口。
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
