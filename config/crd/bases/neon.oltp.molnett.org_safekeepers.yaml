  name: safekeepers.neon.oltp.molnett.org
spec:
  group: neon.oltp.molnett.org
  names:
    kind: Safekeeper
    listKind: SafekeeperList
    plural: safekeepers
    singular: safekeeper
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .status.conditions[?(@.type=="Progressing")].status
      name: Progressing
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Safekeeper is the Schema for the safekeepers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Safekeeper
            properties:
              cluster:
                description: Used to deterministically setup which storage controller
                  and broker to communicate with
                type: string
              id:
                description: |-
                  safekeeper 向 storage-controller 注册时使用的 ID。
                  必须 >= 1，且在集群内唯一。
                format: int32
                minimum: 1
                type: integer
              livenessProbe:
                description: |-
                  LivenessProbe overrides the default liveness probe configuration.
                  When nil, the operator uses built-in defaults aligned with SC's
                  max_offline_interval (30s).
                properties:
                  failureThreshold:
                    description: |-
                      FailureThreshold is the number of consecutive failures required to
                      consider the probe failed.
                    format: int32
                    type: integer
                  initialDelaySeconds:
                    description: |-
                      InitialDelaySeconds is the number of seconds after the container has
                      started before the probe is initiated. Overrides the operator default.
                    format: int32
                    type: integer
                  periodSeconds:
                    description: PeriodSeconds is how often (in seconds) to perform
                      the probe.
                    format: int32
                    type: integer
                  timeoutSeconds:
                    description: TimeoutSeconds is the number of seconds after which
                      the probe times out.
                    format: int32
                    type: integer
                type: object
              readinessProbe:
                description: |-
                  ReadinessProbe overrides the default readiness probe configuration.
                  When nil, the operator uses built-in defaults aligned with SC's
                  heartbeat_interval (5s).
                properties:
                  failureThreshold:
                    description: |-
                      FailureThreshold is the number of consecutive failures required to
                      consider the probe failed.
                    format: int32
                    type: integer
                  initialDelaySeconds:
                    description: |-
                      InitialDelaySeconds is the number of seconds after the container has
                      started before the probe is initiated. Overrides the operator default.
                    format: int32
                    type: integer
                  periodSeconds:
                    description: PeriodSeconds is how often (in seconds) to perform
                      the probe.
                    format: int32
                    type: integer
                  timeoutSeconds:
                    description: TimeoutSeconds is the number of seconds after which
                      the probe times out.
                    format: int32
                    type: integer
                type: object
              startupProbe:
                description: |-
                  StartupProbe overrides the default startup probe configuration.
                  When nil, the operator uses a 60s window (Safekeeper starts fast,
                  no cold-start from S3 like Pageserver).
                properties:
                  failureThreshold:
                    description: |-
                      FailureThreshold is the number of consecutive failures required to
                      consider the probe failed.
                    format: int32
                    type: integer
                  initialDelaySeconds:
                    description: |-
                      InitialDelaySeconds is the number of seconds after the container has
                      started before the probe is initiated. Overrides the operator default.
                    format: int32
                    type: integer
                  periodSeconds:
                    description: PeriodSeconds is how often (in seconds) to perform
                      the probe.
                    format: int32
                    type: integer
                  timeoutSeconds:
                    description: TimeoutSeconds is the number of seconds after which
                      the probe times out.
                    format: int32
                    type: integer
