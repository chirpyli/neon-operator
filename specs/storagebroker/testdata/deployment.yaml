apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  name: test-cluster-storage-broker
  namespace: neon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-cluster-storage-broker
  strategy:
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: test-cluster-storage-broker
    spec:
      containers:
      - args:
        - --listen-addr
        - 0.0.0.0:50051
        command:
        - storage_broker
        image: neondatabase/neon:8463
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /status
            port: 50051
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        name: storage-broker
        ports:
        - containerPort: 50051
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /status
            port: 50051
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources: {}
        startupProbe:
          failureThreshold: 6
          httpGet:
            path: /status
            port: 50051
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
status: {}
