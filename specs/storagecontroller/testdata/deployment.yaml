apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  name: test-cluster-storage-controller
  namespace: neon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-cluster-storage-controller
  strategy:
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: test-cluster-storage-controller
    spec:
      containers:
      - args:
        - --dev
        - -l
        - 0.0.0.0:8080
        - --control-plane-url
        - http://neon-controlplane:8081
        - --initial-split-shards
        - "0"
        command:
        - storage_controller
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: test-cluster-storcon-db
        image: neondatabase/neon:8463
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /live
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        name: storage-controller
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources: {}
        startupProbe:
          failureThreshold: 6
          httpGet:
            path: /status
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
status: {}
