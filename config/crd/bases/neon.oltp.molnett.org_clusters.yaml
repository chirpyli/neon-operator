---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clusters.neon.oltp.molnett.org
spec:
  group: neon.oltp.molnett.org
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .status.conditions[?(@.type=="Progressing")].status
      name: Progressing
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster is the Schema for the clusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Cluster
            properties:
              bucketCredentialsSecret:
                description: Reference to a Secret containing credentials for accessing
                  a storage bucket.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              defaultPGVersion:
                description: |-
                  Default PostgreSQL version to use if no version is specified in projects.
                  kubebuilder:validation:Enum=14;15;16;17
                type: integer
              defaultSafekeeperStorage:
                description: |-
                  DefaultSafekeeperStorage defines the default storage config for
                  auto-created safekeepers. If not set, defaults to Size=10Gi.
                properties:
                  size:
                    description: |-
                      Size of the PVCs.
                      kubebuilder:default:=10Gi
                    type: string
                  storageClass:
                    description: Name of the storage class to use for PVCs.
                    type: string
                required:
                - size
                type: object
              neonImage:
                default: neondatabase/neon:8463
                description: The default Neon image to use for all neon-specific resources.
                type: string
              numSafekeepers:
                default: 3
                description: Decides how many safekeepers to run in the cluster.
                minimum: 3
                type: integer
              postgresExposure:
                description: |-
                  PostgresExposure 控制计算节点 PostgreSQL Service 对外暴露策略。
                  不设置时默认为 ClusterIP（仅集群内访问）。
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations 透传到 Service 的 annotations。
                      用于云厂商 LB 配置，如 AWS NLB、GCP LB 等。
                    type: object
                  externalTrafficPolicy:
                    description: |-
                      ExternalTrafficPolicy 控制外部流量的路由策略。
                      Cluster：流量均匀分发到所有 Pod（默认，可能丢失源 IP）
                      Local：  保留客户端真实 IP，但要求 Pod 在接收流量的节点上运行
                    enum:
                    - Cluster
                    - Local
                    type: string
                  loadBalancerSourceRanges:
                    description: |-
                      LoadBalancerSourceRanges 限制可访问的源 IP CIDR 列表。
                      仅在 Type=LoadBalancer 时生效。用于安全白名单。
                    items:
                      type: string
                    type: array
                  type:
                    default: ClusterIP
                    description: |-
                      Type 决定 Service 类型。
                      ClusterIP：仅集群内访问（默认）
                      NodePort：  通过节点 IP + 端口对外暴露
                      LoadBalancer：云环境自动创建外部 LB
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              storageControllerDatabaseSecret:
                description: |-
                  Reference to a Secret containing credentials for accessing a storage bucket.
