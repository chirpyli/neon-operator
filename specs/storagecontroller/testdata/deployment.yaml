apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/component: storage-controller
    app.kubernetes.io/name: storage-controller
    app.kubernetes.io/part-of: neon
    molnett.org/cluster: test-cluster
  name: test-cluster-storage-controller
  namespace: neon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: storage-controller
      molnett.org/cluster: test-cluster
  strategy:
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/component: storage-controller
        app.kubernetes.io/name: storage-controller
        app.kubernetes.io/part-of: neon
        molnett.org/cluster: test-cluster
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: storage-controller
                molnett.org/cluster: test-cluster
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - -l
        - 0.0.0.0:8080
        - --control-plane-url
        - http://neon-controlplane:8081
        - --initial-split-shards
        - "0"
        command:
        - storage_controller
        env:
        - name: PUBLIC_KEY
          value: '-----BEGIN PUBLIC KEY-----MCowBQYDK2VwAyEAebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ=-----END
            PUBLIC KEY-----'
        - name: PAGESERVER_JWT_TOKEN
          value: eyJhbGciOiJFZERTQSJ9.dummy
        - name: CONTROL_PLANE_JWT_TOKEN
          value: eyJhbGciOiJFZERTQSJ9.dummy
        - name: SAFEKEEPER_JWT_TOKEN
          value: eyJhbGciOiJFZERTQSJ9.dummy
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: test-cluster-storcon-db
        image: neondatabase/neon:8463
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /live
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        name: storage-controller
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        startupProbe:
          failureThreshold: 6
          httpGet:
            path: /status
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /certs
          name: jwt-keys
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      volumes:
      - name: jwt-keys
        secret:
          defaultMode: 292
          items:
          - key: public.pem
            path: public.pem
          secretName: cluster-test-cluster-jwt
status: {}
